services:
  ai-task-center-server:
    build:
      context: ../../../..
      dockerfile: deploy/backend/java_server/local_full/Dockerfile
    image: ai-task-center-server:1.0.0
    container_name: ai-task-center-server
    restart: "no"
    ports:
      - "10051:18743"
    environment:
      TASK_CENTER_SERVER_PORT: 18743
      TASK_CENTER_DB_URL: jdbc:postgresql://postgres16:5432/ai_task_center
      TASK_CENTER_DB_USER: conchi
      TASK_CENTER_DB_PASSWORD: conchi123456
      PYTHON_WORKER_BASE_URL: http://host.docker.internal:10052
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    name: vibedeploy-shared
    external: true
