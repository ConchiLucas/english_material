services:
  backend:
    build:
      context: ${WORKSPACE_HOST_ROOT}
      dockerfile: deploy/context-router/backend.Dockerfile
      args:
        APP_UID: ${HOST_UID:-1000}
    image: english-material-backend:local
    restart: unless-stopped
    environment:
      TASK_CENTER_SERVER_PORT: "18744"
      TASK_CENTER_DB_URL: ${TASK_CENTER_DB_URL}
      TASK_CENTER_DB_USER: ${TASK_CENTER_DB_USER}
      TASK_CENTER_DB_PASSWORD: ${TASK_CENTER_DB_PASSWORD:?Set TASK_CENTER_DB_PASSWORD}
      TASK_CENTER_EXTERNAL_HOST_ALIAS: host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${ENGLISH_MATERIAL_BACKEND_PORT:-18744}:18744"
    volumes:
      - ${WORKSPACE_HOST_ROOT}:/workspace:ro
      - ${CODEX_HOST_HOME}:/home/app/.codex

  frontend:
    build:
      context: ${WORKSPACE_HOST_ROOT}
      dockerfile: deploy/context-router/frontend.Dockerfile
      args:
        VITE_API_BASE: /api
    image: english-material-frontend:local
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${ENGLISH_MATERIAL_FRONTEND_PORT:-19638}:80"
