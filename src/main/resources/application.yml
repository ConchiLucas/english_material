server:
  port: ${TASK_CENTER_SERVER_PORT:18744}

spring:
  main:
    headless: true
  datasource:
    url: ${TASK_CENTER_DB_URL:jdbc:postgresql://localhost:5432/english_material}
    username: ${TASK_CENTER_DB_USER:postgres}
    password: ${TASK_CENTER_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Shanghai

logging:
  level:
    org.hibernate.SQL: warn

image-story:
  storage-root: ${IMAGE_STORY_STORAGE_ROOT:./runtime/image-story}
  allow-portable-storage: ${IMAGE_STORY_ALLOW_PORTABLE_STORAGE:false}
